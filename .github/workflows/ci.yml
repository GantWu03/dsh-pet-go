name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The helper itself only runs on Windows, but build/check/test are platform
    # independent; a Windows job would just add minutes without covering the
    # desktop behaviour that needs a real DSH install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
